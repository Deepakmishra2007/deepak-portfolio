<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Ring Glow Gradient -->
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Monogram Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="250" cy="250" r="235" fill="url(#grid)"/>

  <!-- Tech Orbit Rings -->
  <circle cx="250" cy="250" r="205" fill="none" stroke="url(#glowRing)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="250" cy="250" r="180" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/>
  <circle cx="250" cy="250" r="225" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" stroke-dasharray="40 180"/>

  <!-- Floating Orbit Nodes -->
  <circle cx="250" cy="45" r="5" fill="#38bdf8" filter="url(#softGlow)"/>
  <circle cx="430" cy="210" r="4.5" fill="#a855f7" filter="url(#softGlow)"/>
  <circle cx="70" cy="290" r="4" fill="#6366f1" filter="url(#softGlow)"/>
  <circle cx="390" cy="380" r="5" fill="#38bdf8" filter="url(#softGlow)"/>

  <!-- Center Avatar Silhouette & Monogram Container -->
  <circle cx="250" cy="225" r="120" fill="#0f172a" stroke="rgba(148, 163, 184, 0.2)" stroke-width="2"/>
  
  <!-- Subtle Abstract Developer Silhouette -->
  <path d="M195 290 C195 240, 305 240, 305 290 Z" fill="rgba(99, 102, 241, 0.3)" />
  <circle cx="250" cy="180" r="48" fill="rgba(56, 189, 248, 0.2)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  
  <!-- Neural Network Connections on Silhouette -->
  <circle cx="250" cy="180" r="6" fill="#38bdf8"/>
  <circle cx="230" cy="195" r="4" fill="#a855f7"/>
  <circle cx="270" cy="195" r="4" fill="#818cf8"/>
  <line x1="250" y1="180" x2="230" y2="195" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <line x1="250" y1="180" x2="270" y2="195" stroke="#818cf8" stroke-width="1.5" opacity="0.6"/>
  <line x1="230" y1="195" x2="270" y2="195" stroke="#a855f7" stroke-width="1" opacity="0.4"/>

  <!-- Deepak Mishra Monogram -->
  <text x="250" y="278" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="3">DEEPAK MISHRA</text>
  <text x="250" y="302" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="2">AI / ML ENGINEER</text>

  <!-- Bottom Placeholder Label Tag -->
  <g transform="translate(130, 385)">
    <rect x="0" y="0" width="240" height="38" rx="19" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="5" fill="#10b981"/>
    <text x="135" y="24" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">
      PHOTO PLACEHOLDER
    </text>
  </g>
</svg>
