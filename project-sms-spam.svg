<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSMS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#162038"/>
    </linearGradient>
    <linearGradient id="spamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="hamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="smsGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgSMS)"/>
  <rect width="800" height="450" fill="url(#smsGrid)"/>

  <!-- Glowing Accent Orbs -->
  <circle cx="200" cy="120" r="140" fill="#38bdf8" opacity="0.08" filter="url(#subtleGlow)"/>
  <circle cx="620" cy="300" r="160" fill="#6366f1" opacity="0.08" filter="url(#subtleGlow)"/>

  <!-- Phone / Classifier Frame Mockup -->
  <rect x="180" y="55" width="440" height="340" rx="24" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

  <!-- Header Bar -->
  <path d="M 180 79 A 24 24 0 0 1 204 55 L 596 55 A 24 24 0 0 1 620 79 L 620 105 L 180 105 Z" fill="rgba(30, 41, 59, 0.7)"/>
  <circle cx="215" cy="80" r="6" fill="#ef4444"/>
  <circle cx="235" cy="80" r="6" fill="#f59e0b"/>
  <circle cx="255" cy="80" r="6" fill="#10b981"/>
  <text x="400" y="85" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">NLP SMS CLASSIFIER PIPELINE</text>

  <!-- Incoming Message 1: SPAM -->
  <g transform="translate(210, 125)">
    <rect width="380" height="65" rx="14" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(239, 68, 68, 0.35)" stroke-width="1"/>
    <!-- Warning Icon -->
    <circle cx="32" cy="32" r="16" fill="rgba(239, 68, 68, 0.2)"/>
    <text x="32" y="37" font-family="sans-serif" font-size="14" font-weight="700" fill="#ef4444" text-anchor="middle">!</text>
    <text x="62" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">"Claim your free voucher NOW! Click link..."</text>
    <text x="62" y="47" font-family="monospace" font-size="11" fill="#94a3b8">Text Preprocessing • Tokenized • Vectorized</text>
    <!-- Spam Tag -->
    <rect x="295" y="18" width="68" height="26" rx="13" fill="url(#spamGrad)"/>
    <text x="329" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">SPAM</text>
  </g>

  <!-- NLP Classification Engine Visualizer -->
  <g transform="translate(210, 205)">
    <rect width="380" height="42" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(56, 189, 248, 0.2)" stroke-dasharray="4 4"/>
    <text x="190" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">TF-IDF Vectorizer ➔ Feature Extraction ➔ ML Classifier</text>
  </g>

  <!-- Incoming Message 2: HAM (Legitimate) -->
  <g transform="translate(210, 260)">
    <rect width="380" height="65" rx="14" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
    <!-- Checkmark Icon -->
    <circle cx="32" cy="32" r="16" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="32" y="37" font-family="sans-serif" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle">✓</text>
    <text x="62" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">"Hey Deepak, see you at the campus library."</text>
    <text x="62" y="47" font-family="monospace" font-size="11" fill="#94a3b8">Standard message pattern verified</text>
    <!-- Ham Tag -->
    <rect x="295" y="18" width="68" height="26" rx="13" fill="url(#hamGrad)"/>
    <text x="329" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">HAM</text>
  </g>

  <!-- Bottom Stats / Tech Pills -->
  <g transform="translate(230, 345)">
    <rect x="0" y="0" width="105" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)"/>
    <text x="52" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Python</text>

    <rect x="115" y="0" width="130" height="26" rx="13" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(99, 102, 241, 0.3)"/>
    <text x="180" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">Machine Learning</text>

    <rect x="255" y="0" width="85" height="26" rx="13" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.3)"/>
    <text x="297" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">NLP</text>
  </g>
</svg>
